spring.application.name=reportai

# --- Banco de dados ---
# Padrão: H2 embutido em arquivo (./data/reportai.mv.db) — zero instalação,
# ótimo pra desenvolver agora. Quando for pra produção, ativar o profile
# "postgres" (application-postgres.properties) com: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/reportai;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 pra inspecionar as tabelas em http://localhost:8080/h2-console
# (JDBC URL pra colar lá: jdbc:h2:file:./data/reportai)
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Upload de arquivo ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- CORS (front-end React/Vite) ---
app.cors.allowed-origin=http://localhost:5173

# --- IA (Google Gemini) ---
# Defina a variável de ambiente AI_API_KEY antes de rodar a aplicação.
# Pegue a chave em https://aistudio.google.com (free tier, sem cartão de crédito).
# NUNCA coloque a chave real direto aqui / no Git.
ai.api-key=${AI_API_KEY}
ai.model=gemini-3.1-flash-lite
ai.max-tokens=9000
